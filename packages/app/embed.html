<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>CFW FileUp Player</title>
    <script type="application/json" id="embed-config">{}</script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .embed-error {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        margin: 0;
        padding: 16px;
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <video id="video" controls playsinline preload="metadata"></video>
    <script type="module" src="/src/embed/main.ts"></script>
  </body>
</html>
